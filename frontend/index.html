<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessFlow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #111; background: #fff; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input, button { font-size: 1rem; padding: .5rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 1rem; background: #0b5cad; color: #fff; border: 0; cursor: pointer; }
    button:focus, input:focus { outline: 3px solid #f5a623; outline-offset: 2px; }
    li { margin: .5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>AccessFlow (placeholder)</h1>
    <p>Pagina de teste do pipeline. O frontend real do time substitui este arquivo.</p>
    <form id="f">
      <label for="local">Local</label>
      <input id="local" required>
      <label for="desc">Descricao do obstaculo</label>
      <input id="desc" required>
      <button type="submit">Registrar ocorrencia</button>
    </form>
    <h2>Ocorrencias</h2>
    <ul id="lista" aria-live="polite"></ul>
  </main>
  <script>
    async function carregar() {
      const r = await fetch('/api/ocorrencias');
      const itens = await r.json();
      const ul = document.getElementById('lista');
      ul.replaceChildren(...itens.map(i => {
        const li = document.createElement('li');
        li.textContent = `${i.local}: ${i.descricao} (${i.status})`;
        return li;
      }));
    }
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/ocorrencias', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({local: local.value, descricao: desc.value})
      });
      e.target.reset(); carregar();
    });
    carregar();
  </script>
</body>
</html>
