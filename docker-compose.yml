services:
  api:
    image: ${API_IMAGE:-accessflow-api:local}
    build: ./api
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    image: ${FRONTEND_IMAGE:-accessflow-frontend:local}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # definido no .env da VM (gerado pelo Terraform) ou no .env local; nunca no git
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000" # no Azure, o NSG so libera esta porta para o IP do admin

volumes:
  prom_data:
  grafana_data:
